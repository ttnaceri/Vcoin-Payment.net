<!DOCTYPE html>
<html lang="uz">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Vcoin — Payment App</title>
  <link rel="icon" type="image/x-icon" href="icon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">  
  <script src="https://cdn.jsdelivr.net/npm/qrcodejs@1.0.0/qrcode.min.js"></script>  
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>  
  <link rel="stylesheet" href="theme.css">
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="auth.css">
  <link rel="stylesheet" href="dashboard.css">
  <link rel="stylesheet" href="admin.css">
  <link rel="stylesheet" href="developer.css">
  <link rel="stylesheet" href="responsive.css">
</head>
<body>
  <div id="splash" class="splash-screen">
    <div class="splash-content">
      <div class="splash-logo">V</div>
      <h1>Vcoin</h1>
      <div class="splash-loader"></div>
    </div>
  </div>
  
  <div id="app" class="app-container" style="display: none;">
    <header id="topbar" class="topbar">
      <button id="backBtn" class="topbar-btn" style="display: none;">
        <i class="fas fa-arrow-left"></i>
      </button>
      <h2 id="pageTitle" class="topbar-title">Vcoin</h2>
      <button id="refreshBtn" class="topbar-btn" onclick="if(typeof Dashboard!=='undefined')Dashboard.doRefresh()" title="Yangilash">
        <i class="fas fa-rotate-left"></i>
      </button>
      <div class="topbar-actions">
          <span id="topNotifBadge" class="notif-badge" style="display: none;">0</span>
        </button>
      </div>
    </header>
    
    <main id="mainContent" class="main-content"></main>
    
    <nav id="bottomNav" class="bottom-nav" style="display: none;">
      <button class="nav-item active" data-page="dashboard">
        <i class="fas fa-home"></i>
        <span data-i18n="dashboard"></span>
      </button>
      <button class="nav-item" data-page="transfer">
        <i class="fa-solid fa-arrow-right-arrow-left"></i>
        <span data-i18n="send">Jo'natish</span>
      </button>
      <button class="nav-item" data-page="deposit">
        <i class="fas fa-chart-line"></i>
        <span data-i18n="deposit">Depozit</span>
      </button>
      <button class="nav-item" data-page="profile">
        <i class="fas fa-user"></i>
        <span data-i18n="profile">Profil</span>
      </button>
    </nav>
  </div>
  
  <!-- ===== MODAL ===== -->
  <div id="modalOverlay" class="modal-overlay" style="display: none;">
    <div id="modalContent" class="modal-content"></div>
  </div>
  
  <!-- ===== TOAST ===== -->
  <div id="toastContainer" class="toast-container"></div>

  <!-- ============================================================ -->
  <!-- ===== JAVASCRIPT FAYLLAR (TO'G'RI TARTIBDA) ===== -->
  <!-- ============================================================ -->
  
  <!-- 1. CONFIG - MAXFIY MA'LUMOTLAR (ENG AVVAL YUKLANADI) -->
  <script src="config.js"></script>
  
  <!-- 2. ASOSIY MODULLAR -->
  <script src="storage.js"></script>
  <script src="cloud.js"></script>
  <script src="utils.js"></script>
  <script src="lang.js"></script>
  
  <!-- 3. UI VA ROUTER -->
  <script src="ui.js"></script>
  <script src="router.js"></script>
  
  <!-- 4. MODULLAR -->
  <script src="auth.js"></script>
  <script src="dashboard.js"></script>
  <script src="wallet.js"></script>
  <script src="transfer.js"></script>
  <script src="receipt.js"></script>
  <script src="deposit.js"></script>
  <script src="token.js"></script>
  <script src="vcoin-api.js"></script>
  <script src="history.js"></script>
  <script src="notifications.js"></script>
  <script src="developer.js"></script>
  <script src="admin.js"></script>
  <script src="settings.js"></script>
  
  <!-- 5. APP (ENG OXIRGI) -->
  <script src="app.js"></script>
</body>
</html>
